version: 1
defaults:
  concurrency: 4
  timeout_s: 1800
  fallback:
  - codex
  - claude
agents:
  claude:
    enabled: true
    cmd: claude
    categories:
    - refactor
    - review
    - architecture
    - debug
    - implement
    cost: high
    concurrency: 2
    models:
      fast: claude-haiku-5-5
      balanced: claude-sonnet-5-5
      deep: claude-opus-5-5
  codex:
    enabled: true
    cmd: codex
    categories:
    - implement
    - bugfix
    - test
    - migrate
    cost: medium
    concurrency: 3
    models:
      fast: default
      balanced: default
      deep: default
  cursor:
    enabled: false
    cmd: agent
    categories:
    - implement
    - refactor
    models:
      default: auto
